name: checkov

on:
  push:
    branches:
      - main
    paths:
      - "ci/terraform/**"
      - "template.yaml"
      - "ci/cloudformation/**"
      - "checkov-policies/**"
  pull_request:
    branches:
      - main
    paths:
      - "ci/terraform/**"
      - "template.yaml"
      - "ci/cloudformation/**"
      - "checkov-policies/**"
      - ".github/workflows/checkov.yml"

  workflow_dispatch:

jobs:
  scan:
    strategy:
      matrix:
        module:
          - account-management
          - oidc
          - shared
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        with:
          directory: ci/terraform/${{ matrix.module }}
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
          skip_check: CKV_OPENAPI_20,CKV_OPENAPI_4

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v3.25.12v3
        with:
          sarif_file: results.sarif
          category: ${{ matrix.module }}

  scan-orch:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        with:
          file: template.yaml
          framework: cloudformation
          quiet: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
          external_checks_dirs: checkov-policies

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v3.25.12v3
        with:
          sarif_file: results.sarif
          category: orch-sam

  scan-api-sam:
    strategy:
      matrix:
        template:
          - {
              source_dir: "ci/cloudformation/auth",
              file: "auth-template.yaml",
              category: "auth-sam",
            }
          - {
              source_dir: "ci/cloudformation/account-management",
              file: "am-template.yaml",
              category: "am-sam",
            }
          - {
              source_dir: "ci/cloudformation/account-data",
              file: "ad-template.yaml",
              category: "ad-sam",
            }
          - {
              source_dir: "ci/cloudformation/utils",
              file: "utils-template.yaml",
              category: "utils-sam",
            }
          - {
              source_dir: "ci/cloudformation/stubs",
              file: "stubs-template.yaml",
              category: "stubs-sam",
            }
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rain
        uses: ./.github/actions/install-rain
        with:
          version: "v1.23.0"
          arch: "linux-amd64"
          sha256: "2fdfe059566acf15ad23e014a7856e88f6af61710854208a93526eec80f4078f"

      - name: Merge templates
        run: "./scripts/merge-templates.sh"
        env:
          TEMPLATE_SOURCE_DIR: ${{ matrix.template.source_dir }}
          TEMPLATE_FILE: ${{ matrix.template.file }}

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        with:
          file: ${{ matrix.template.file }}
          framework: cloudformation
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
          external_checks_dirs: checkov-policies

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v3.25.12v3
        with:
          sarif_file: results.sarif
          category: ${{ matrix.template.category }}
