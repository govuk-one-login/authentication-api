name: Create Terraform-only promotion artifact

on:
  workflow_call:
    inputs:
      terraform_directory_name:
        description: "The name of the directory where the terraform for this module is stored"
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Zip ${{ inputs.terraform_directory_name }} Terraform files
        working-directory: ci/terraform
        env:
          TERRAFORM_DIR: ${{ inputs.terraform_directory_name }}
        run: zip -r "$TERRAFORM_DIR.zip" .

      - name: upload promotion_artifact_${{ inputs.terraform_directory_name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          TERRAFORM_DIR: ${{ inputs.terraform_directory_name }}
        with:
          name: promotion_artifact_${{ env.TERRAFORM_DIR }}
          path: ci/terraform/${{ env.TERRAFORM_DIR }}.zip
