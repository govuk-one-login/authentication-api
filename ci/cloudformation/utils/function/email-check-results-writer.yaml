Resources:
  EmailCheckResultsWriterLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub
        - "${EnvironmentName}-email-check-results-writer-lambda"
        - EnvironmentName:
            !If [UseSubEnvironment, !Ref SubEnvironment, !Ref Environment]
      CodeUri: ./utils/build/distributions/utils.zip
      Handler: uk.gov.di.authentication.utils.lambda.EmailCheckResultWriterHandler::handleRequest
      Layers:
        - arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_313_36_20250507-184408_with_collector_java:1
      Environment:
        Variables:
          ENVIRONMENT:
            !If [UseSubEnvironment, !Ref SubEnvironment, !Ref Environment]
          DYNAMO_ARN_PREFIX: !Sub
            - "arn:aws:dynamodb:${AWS::Region}:${DataStoreAccountId}:table/"
            - DataStoreAccountId:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  dataStoreAccountId,
                ]
          AWS_LAMBDA_EXEC_WRAPPER: /opt/dynatrace
          DT_CONNECTION_AUTH_TOKEN: !Sub
            - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CONNECTION_AUTH_TOKEN}}"
            - SecretArn:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  dynatraceSecretArn,
                ]
          DT_CONNECTION_BASE_URL: !Sub
            - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CONNECTION_BASE_URL}}"
            - SecretArn:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  dynatraceSecretArn,
                ]
          DT_CLUSTER_ID: !Sub
            - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CLUSTER_ID}}"
            - SecretArn:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  dynatraceSecretArn,
                ]
          DT_LOG_COLLECTION_AUTH_TOKEN: !Sub
            - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_LOG_COLLECTION_AUTH_TOKEN}}"
            - SecretArn:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  dynatraceSecretArn,
                ]
          DT_TENANT: !Sub
            - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_TENANT}}"
            - SecretArn:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  dynatraceSecretArn,
                ]
          DT_OPEN_TELEMETRY_ENABLE_INTEGRATION: "true"
          OTEL_INSTRUMENTATION_AWS_SDK_EXPERIMENTAL_USE_PROPAGATOR_FOR_MESSAGING: "true"
          JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 '--add-reads=jdk.jfr=ALL-UNNAMED'"
      Events:
        EmailCheckResultsQueueEvent:
          Type: SQS
          Properties:
            Queue: !If
              - UseSubEnvironment
              - !FindInMap [
                  EnvironmentConfiguration,
                  !Ref SubEnvironment,
                  pendingEmailCheckQueueResultArn,
                ]
              - !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  pendingEmailCheckQueueResultArn,
                ]
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - !Ref LambdaBasicExecutionPolicy
        - !Ref EmailCheckResultsTableWritePolicy
        - !Ref EmailCheckResultsSqsAccessPolicy
        - !Ref PendingEmailCheckResultsQueueKmsAccessPolicy
        - !Ref CloudWatchLogsKmsAccessPolicy
      LoggingConfig:
        LogGroup: !Ref EmailCheckResultsWriterLogGroup
      Timeout: 30
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig: !If
        - EnableEmailCheckResultsProvisionedConcurrency
        - ProvisionedConcurrentExecutions: !FindInMap
            - EnvironmentConfiguration
            - !Ref Environment
            - emailCheckResultsWriterProvisionedConcurrency
        - !Ref AWS::NoValue
      Tags:
        Name: !Sub
          - "${EnvironmentName}-email-check-results-writer-lambda"
          - EnvironmentName:
              !If [UseSubEnvironment, !Ref SubEnvironment, !Ref Environment]
        Environment:
          !If [UseSubEnvironment, !Ref SubEnvironment, !Ref Environment]

  EmailCheckResultsWriterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/${EnvironmentName}-email-check-results-writer-lambda"
        - EnvironmentName:
            !If [UseSubEnvironment, !Ref SubEnvironment, !Ref Environment]
      RetentionInDays: !If
        - UseSubEnvironment
        - !FindInMap [
            EnvironmentConfiguration,
            !Ref SubEnvironment,
            logRetentionDays,
          ]
        - !FindInMap [
            EnvironmentConfiguration,
            !Ref Environment,
            logRetentionDays,
          ]
      KmsKeyId: !GetAtt MainKmsKey.Arn

  EmailCheckResultsWriterLogSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Condition: IsSplunkEnabled
    Properties:
      LogGroupName: !Ref EmailCheckResultsWriterLogGroup
      FilterPattern: ""
      DestinationArn: !Ref LoggingSubscriptionEndpointArn

  EmailCheckResultsWriterErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseAlarmActions
    Properties:
      AlarmName: !Sub
        - "${EnvironmentName}-email-check-results-writer-lambda-errors"
        - EnvironmentName:
            !If [UseSubEnvironment, !Ref SubEnvironment, !Ref Environment]
      AlarmDescription: Triggers when email check results writer Lambda error rate exceeds threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: !If
        - UseSubEnvironment
        - !FindInMap [
            EnvironmentConfiguration,
            !Ref SubEnvironment,
            lambdaErrorThreshold,
          ]
        - !FindInMap [
            EnvironmentConfiguration,
            !Ref Environment,
            lambdaErrorThreshold,
          ]
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref EmailCheckResultsWriterLambda
      TreatMissingData: notBreaching
